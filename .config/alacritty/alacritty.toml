#Version 0.2.0
[window]
startup_mode = "Fullscreen"
padding = { x = 8, y = 8 }
level = "AlwaysOnTop"
dynamic_padding = true
decorations = "none"
opacity = 0.95
decorations_theme_variant = "Dark"

[mouse]
hide_when_typing = true

[font]
size = 12.5

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[cursor]
style = { shape = "Block", blinking = "On" }

[scrolling]
history = 10000
multiplier = 5

[colors.primary]
background = "#1a1b26"
foreground = "#c0caf5"

[colors.normal]
black   = "#15161e"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#a9b1d6"

[env]
TERM = "xterm-256color"
