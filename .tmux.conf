#Version 0.2.0
#Enable mouse support: click to select panes/windows, scroll, resize panes.
set -g mouse on

#Number of lines to keep in scrollback buffer per pane.
set -g history-limit 10000

#Starting index for window numbers
set -g base-index 1

#Starting index for pane numbers within windows.
setw -g pane-base-index 1

# Start new Windows and Panes current path
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Resource config file
bind r source-file ~/.tmux.conf \; display "Reloaded!"
                             
set-option -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*256col*:Tc"

                              
# List of plugins (add more below)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
#set -g @plugin 'christoomey/vim-tmux-navigator'
# Status bar
set -g status-position top
set -g status on
set -g status-style "bg=#111318,fg=#ffffff"

# Session
set -g status-left "#[fg=#ffffff,bg=#000000] #S   #[default]"

# Passive window
set -g window-status-format "#[fg=#4f5561]#I #[fg=#8b919d]#W #[fg=#30343d]│"
set-window-option -g window-status-current-style "fg=#ffffff,bg=#111318"

# Active window
set -g window-status-current-format "#[fg=#000000,bg=#ffffff,bold] #I #[fg=#111318,bg=#7aa2f7] #W #[fg=#7aa2f7,bg=#111318] #[default]"

# Window separator
set -g window-status-separator " "

# Right side
set -g status-right "#[fg=#a9b1d6]󰥔 %d-%m-%Y %H:%M "

# Pane borders
set -g pane-border-style "fg=#FFFFFF,bold"
set -g pane-active-border-style "fg=#eb4034"

# Messages
set -g message-style "bg=#1a1d24,fg=#c0caf5,bold"
set -g message-command-style "bg=#1a1d24,fg=#c0caf5"

# Mode
set -g mode-style "bg=#7aa2f7,fg=#111318,bold"

# Clock
set -g clock-mode-colour "#7aa2f7"
set -g clock-mode-style 24

# Automatic window naming
set -g renumber-windows on
set -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_command}"

# Allow manual renaming
set -g allow-rename on

run '~/.tmux/plugins/tpm/tpm'
